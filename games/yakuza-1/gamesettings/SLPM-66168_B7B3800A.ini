; Yakuza 1 / Ryu ga Gotoku - per-game settings
; Serial: SLPM-66168 | CRC: B7B3800A
; Filename confirmed from the user's PCSX2 Properties screenshot.
; Target hardware: Ryzen 7 5700X / RTX 3080 12 GB.
; User-confirmed: bottom/right edge artifacts corrected with the matching v1.0 PNACH.
; Confirmed in the tested street scenes; full-game coverage is not certified.
;
; Installation:
; Open PCSX2 Tools > Open Data Directory, then open gamesettings.
; Close PCSX2 and place this file there WITHOUT renaming it.
; If the same filename already exists, back it up before replacing it.
; Start the game fresh and load a normal memory-card save for the first test.
; Do not overwrite the global PCSX2.ini.
;
; Vulkan, 4x internal resolution, Full blending, zero crop.
; Automatic fixes depend on the GameDB bundled with the installed PCSX2.
; The v2.8.2 GameDB includes bloom alignment and native-scaling fixes
; for SLPM-66168; older builds may have fewer automatic fixes.
; If speed is insufficient, change only upscale_multiplier from 4 to 3.

[EmuCore]
EnableGameFixes = true

[EmuCore/GS]
; Vulkan; 4x internal resolution; Full blending accuracy.
Renderer = 14
upscale_multiplier = 4
accurate_blending_unit = 4

; Keep manual hardware hacks off so the official per-game fixes can apply.
UserHacks = false

; PS2 texture filtering, automatic trilinear filtering, full texture preloading.
filter = 2
TriFilter = -1
MaxAnisotropy = 0
texture_preloading = 2
HWDownloadMode = 0

; Preserve the whole display; no crop and no vertical zoom.
CropLeft = 0
CropTop = 0
CropRight = 0
CropBottom = 0
StretchY = 100

; Turning anti-blur off did not resolve the previously reported line.
pcrtc_antiblur = true
